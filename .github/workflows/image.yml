name: Test and publish image

# Publishes ghcr.io/philippkuhlmann/pk95-ad, the image PK95 Core starts (catalog "ad").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Debian trixie's Python
      - run: pip install pyflakes
      - run: python -m pyflakes pk95ad tests
      - run: python -m unittest discover -s tests -t . -v

  # Provisions a real domain in the image (plain Docker: no CAP_SYS_ADMIN, so security.* xattrs fail
  # like in an unprivileged LXC) and runs every API area against it.
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Random API token for this run
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pk95-ad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name pk95ad -p 8389:8389 \
            --add-host=host.docker.internal:host-gateway \
            -e PK95_CORE_MODE=1 -e PK95_CORE_TOKEN=$TOKEN \
            -e PK95_CORE_URL=http://host.docker.internal:18080 \
            -v ad_samba:/var/lib/samba -v ad_config:/etc/samba -v ad_data:/var/lib/pk95ad \
            pk95-ad:ci
      - name: End-to-end test
        run: python3 tests/integration/run.py http://127.0.0.1:8389 $TOKEN pk95ad 18080
      - name: Container log
        if: always()
        run: docker logs pk95ad 2>&1 | tail -300

  image:
    needs: [test, integration]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philippkuhlmann/pk95-ad
          tags: |
            # "latest" (what PK95 Core pulls) only from a release tag v1.2.3, so the image always
            # carries the version the Core module checks; main builds are "main" and "sha-…".
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Debian packages for both architectures (Raspberry Pi, ARM VPS); the app is plain Python.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '1.0.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
